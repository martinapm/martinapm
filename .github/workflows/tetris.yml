name: Generate Tetris

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: martinapm
          outputs: |
            dist/tetris-contribution-graph.svg?color_snake=f5e6e8&color_dots[]=1a0505&color_dots[]=3b0808&color_dots[]=6b2d3e&color_dots[]=a35c6e&color_dots[]=d4a0a0
            dist/tetris-contribution-graph-dark.svg?color_snake=f5e6e8&color_dots[]=1a0505&color_dots[]=3b0808&color_dots[]=6b2d3e&color_dots[]=a35c6e&color_dots[]=d4a0a0&color_bg=0d1117
          game: tetris

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
