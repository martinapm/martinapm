ame: Daily streak — update counter

on:
  schedule:
    - cron: '5 0 * * *'   # cada día a las 00:05 UTC
  workflow_dispatch:        # también se puede lanzar a mano desde Actions

jobs:
  update-counter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate day counter and update README
        run: |
          START_DATE="2025-03-20"
          TODAY=$(date -u +%Y-%m-%d)
          DAY_COUNT=$(( ( $(date -d "$TODAY" +%s) - $(date -d "$START_DATE" +%s) ) / 86400 + 1 ))
          FORMATTED_TODAY=$(date -u +"%b %d, %Y")

          NEW_BADGE="[![Days active](https://img.shields.io/badge/Active%20since%20Mar%2020%2C%202025-Day%20${DAY_COUNT}-f5e6e8?style=for-the-badge&labelColor=6b2d3e&color=1a0505)](https://github.com/martinapm)"

          # Reemplaza la línea del badge entre los marcadores
          sed -i "/<!-- COUNTER:START -->/,/<!-- COUNTER:END -->/{
            /<!-- COUNTER:START -->/{
              n
              s|.*|${NEW_BADGE}|
            }
          }" README.md

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: day counter update $(date -u +%Y-%m-%d)"
          git push
